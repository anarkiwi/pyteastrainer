[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyteastrainer"
version = "0.1.0"
description = "Fail the pytest run when the suite has grown redundant: per-test coverage + AST fingerprints + ratchet baseline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pytest>=7.0", "coverage>=7.0"]
classifiers = ["Framework :: Pytest"]

[project.entry-points.pytest11]
pyteastrainer = "pyteastrainer.plugin"

[tool.setuptools.packages.find]
include = ["pyteastrainer*"]
