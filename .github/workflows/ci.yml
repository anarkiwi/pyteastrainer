name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: 2
  MKL_NUM_THREADS: 2
  OPENBLAS_NUM_THREADS: 2
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e .[test]
      - run: black --check .
      - run: pylint pyteastrainer tests
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      - name: plugin tests
        run: pytest -n auto --cov
      - name: demo suite must fail the gate
        working-directory: demo
        run: |
          set +e
          pytest -q --strain --strain-report strain-report.json
          [ $? -eq 1 ] || { echo "expected exit 1 from the gate"; exit 1; }
          python -c "import json; r=json.load(open('strain-report.json')); k={a['kind'] for a in r['actions']}; assert {'duplicate','case','subset','union','same'} <= k and r['parametrize'], k"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
