name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest-cov
      - name: plugin tests
        run: pytest -q tests/
      - name: demo suite must fail the gate
        working-directory: demo
        run: |
          set +e
          pytest -q --strain --strain-report strain-report.json
          [ $? -eq 1 ] || { echo "expected exit 1 from the gate"; exit 1; }
          python -c "import json; m=json.load(open('strain-report.json'))['metrics']; assert m['duplicates']==3, m"
